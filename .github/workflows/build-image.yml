name: Build and publish SeerrNG Classic

on:
  push:
    branches:
      - classic-interface
    paths:
      - 'scripts/**'
      - 'overlays/**'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'SeerrNG commit SHA or ref to build against'
        required: true
        default: '471271589e28a77a2e1564b2ef4e1c152e7cf103'
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  # Give each commit its own build group; a runner stuck during Docker cleanup
  # must not hold a newer patched image in the pending queue.
  group: seerrng-classic-image-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UPSTREAM_REF: ${{ github.event.inputs.upstream_ref || '471271589e28a77a2e1564b2ef4e1c152e7cf103' }}
      IMAGE_NAME: ghcr.io/frenchyx24/seerrng-classic
    steps:
      - name: Check out customization repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Fetch pinned SeerrNG source and apply overlay
        shell: bash
        run: |
          set -euo pipefail
          SRC="${RUNNER_TEMP}/seerrng-source"
          git clone --filter=blob:none https://github.com/snapetech-org/seerrng.git "$SRC"
          git -C "$SRC" fetch --depth 1 origin "$UPSTREAM_REF"
          git -C "$SRC" checkout --detach FETCH_HEAD
          node scripts/apply-overrides.mjs "$SRC"
          echo "SOURCE_DIR=$SRC" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/seerrng-source
          file: ${{ runner.temp }}/seerrng-source/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            COMMIT_TAG=${{ env.UPSTREAM_REF }}
            BUILD_VERSION=classic
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=SeerrNG Classic
            org.opencontainers.image.description=SeerrNG with the classic Seerr 3.5.1 interface overlay
            org.opencontainers.image.source=https://github.com/frenchyx24/SeerrNG-Classic

      - name: Report published image
        run: |
          echo "Published image: ${IMAGE_NAME}:latest"
          echo "Upstream ref: ${UPSTREAM_REF}"
