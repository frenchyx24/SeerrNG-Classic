name: Publish SeerrNG Classic homepage rendering fix

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - patch-homepage-cache-bust.cjs
      - .github/workflows/publish-theme-fix.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/frenchyx24/seerrng-classic:1.0.6
